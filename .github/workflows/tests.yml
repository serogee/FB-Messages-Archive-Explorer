name: Tests

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm test
            - run: npx playwright install --with-deps chromium webkit
            - run: npm run build
            - run: node scripts/run-e2e.mjs
