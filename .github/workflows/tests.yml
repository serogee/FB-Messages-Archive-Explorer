name: Tests

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    unit-tests:
        name: Unit tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
            - run: npm test
            - run: npm run build
